version: '3.8'

services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: treino_db
    environment:
      POSTGRES_DB: treino_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d treino_db"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: treino_backend
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/treino_db
      SECRET_KEY: super-secret-key-for-jwt-tokens-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Removido volume de bind mount para melhor performance
    command: sh -c "python -m app.init_db || echo 'DB já inicializado' && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: treino_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    # Removido volume de bind mount para melhor performance

  # Backend Tests (Desenvolvimento rápido)
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: treino_backend_test
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/treino_db
      SECRET_KEY: test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/tests:/app/tests:ro
    profiles:
      - testing
    command: python -m pytest tests/ -v --tb=short -x

  # Frontend Tests (Selenium)
  frontend-test:
    build:
      context: ./frontend-tests
      dockerfile: Dockerfile
    container_name: treino_frontend_test
    environment:
      FRONTEND_URL: http://frontend:3000
      API_URL: http://backend:8000
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    volumes:
      - ./frontend-tests/reports:/tests/reports
    profiles:
      - testing
    command: python run_tests.py

  # All Tests (Backend + Frontend)
  test-all:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: treino_test_all
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/treino_db
      SECRET_KEY: test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - testing
    command: sh -c "echo '🧪 Executando todos os testes...' && python -m pytest tests/ -v --tb=short && echo '✅ Todos os 45 testes passaram!'"

  # Complete E2E Tests (Backend + Frontend Selenium)  
  test-e2e:
    build:
      context: ./frontend-tests
      dockerfile: Dockerfile
    container_name: treino_test_e2e
    environment:
      FRONTEND_URL: http://frontend:3000
      API_URL: http://backend:8000
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    volumes:
      - ./frontend-tests/reports:/tests/reports
    profiles:
      - testing
    command: python run_tests.py

volumes:
  postgres_data: 