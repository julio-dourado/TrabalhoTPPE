# ======================================================================
# AWS App Runner configuration file
# ======================================================================

version: 1.0

# Runtime gerenciado pelo App Runner
runtime: python311 # (equivale ao Python 3.11)

# ----------------------------------------------------------------------
# BUILD SECTION
# ----------------------------------------------------------------------
build:
  # Dependências de sistema necessárias durante o build
  commands:
    pre-build:
      - |
        apt-get update \
        && apt-get install -y postgresql-client curl \
        && rm -rf /var/lib/apt/lists/*

# ----------------------------------------------------------------------
# RUN SECTION
# ----------------------------------------------------------------------
run:
  # Garante que o container execute exatamente a versão 3.11․* do runtime
  runtime-version: "3.11"

  # Instala dependências Python imediatamente antes de subir o serviço
  pre-run:
    - pip install --upgrade pip
    - pip install -r requirements.txt

  # Comando que inicia a aplicação
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Porta exposta pelo serviço
  network:
    port: 8000

  # (intencionalmente não há env nem secrets aqui — serão criados no console)
