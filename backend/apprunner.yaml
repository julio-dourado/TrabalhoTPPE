version: 1.0

# Nome correto do runtime gerenciado
runtime: python311 # <‑‑ era python3.11

build:
  commands:
    # ainda pode instalar pacotes de sistema aqui
    pre-build:
      - apt-get update && apt-get install -y postgresql-client curl && rm -rf /var/lib/apt/lists/*
    # ***Para Python 3.11 o App Runner recomenda instalar dependências
    # no pre‑run, não no build, porque o processo de build revisto descarta
    # tudo o que fica fora de /app.***
    build: [] # vazio ou remova

run:
  # Opcional, mas útil para travar a versão menor/patch:
  runtime-version: 3.11
  pre-run:
    - pip3 install --upgrade pip
    - pip3 install -r requirements.txt
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  variables:
    ALGORITHM: HS256
    ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
