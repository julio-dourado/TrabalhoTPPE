# ===============================================================
# AWS App Runner configuration
# ===============================================================

version: 1.0
runtime: python311           # (Python 3.11 gerenciado)

# ---------------------------------------------------------------
# BUILD
# ---------------------------------------------------------------
build:
  commands:
    # Pacotes de sistema necessários em runtime ou build
    pre-build:
      - |
        # Amazon Linux 2023 → dnf
        dnf install -y postgresql15 curl
        dnf clean all
    # Passo de build “vazio” só para cumprir o schema
    build:
      - echo "Build layer complete"

# ---------------------------------------------------------------
# RUN
# ---------------------------------------------------------------
run:
  runtime-version: "3.11"

  # Instala dependências Python logo antes de iniciar a app
  pre-run:
    - pip install --upgrade pip
    - pip install -r requirements.txt

  # Comando da aplicação FastAPI
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Porta que o App Runner expõe
  network:
    port: 8000

  # Deixe env / secrets para acrescentar via Console
