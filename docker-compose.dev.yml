version: '3.8'

# Docker Compose para DESENVOLVIMENTO com hot reload
# Use: docker-compose -f docker-compose.dev.yml up

services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: treino_db_dev
    environment:
      POSTGRES_DB: treino_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d treino_db"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 5s

  # Backend API (Development com hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: treino_backend_dev
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/treino_db
      SECRET_KEY: dev-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Volume para hot reload (mais lento mas permite edições)
      - ./backend:/app:cached
    command: sh -c "python -m app.init_db || echo 'DB já inicializado' && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Frontend Next.js (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: treino_frontend_dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      # Volume para hot reload
      - ./frontend:/app:cached
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data_dev: 